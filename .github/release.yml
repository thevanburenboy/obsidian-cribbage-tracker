changelog:
    categories:
        - title: '🚀 New Features'
          labels:
              - feature
              - enhancement
        - title: '🐛 Bug Fixes'
          labels:
              - fix
              - bug
        - title: '🧰 Maintenance'
          labels:
              - chore
              - documentation
    exclude:
        labels:
            - skip-changelog
        authors:
            - dependabot[bot]
