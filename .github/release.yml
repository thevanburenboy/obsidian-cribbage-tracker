changelog:
    categories:
        - title: '🚀 New Features'
          labels:
              - feature
              - enhancement
        - title: '🐛 Bug Fixes'
          labels:
              - fix
              - bug
        - title: '🧰 Maintenance'
          labels:
              - chore
              - documentation
        - title: '🤖 Dependency Updates'
          labels:
              - dependencies
    exclude:
        labels:
            - skip-changelog
